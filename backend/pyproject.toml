[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodeless-sc-gap"
version = "0.1.0"
description = "Extract the London penetration depth and the nodeless superconducting gap from self-field critical current data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",          # FastAPI's TestClient needs this
    # Only so that tests/test_legacy_agreement.py can run the archived
    # prototypes as a numerical cross-check. The application itself does not
    # use pandas and must not acquire the dependency.
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
